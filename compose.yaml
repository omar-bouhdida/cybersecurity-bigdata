services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: bigdata-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  flume:
    image: cybersecurity-flume:1.11.0
    container_name: bigdata-flume
    network_mode: host
    user: "1000:1000"
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_COMMON_LIB_NATIVE_DIR: /opt/hadoop/lib/native
      HADOOP_USER_NAME: vboxuser
    volumes:
      - ./flume/conf:/opt/flume/conf:ro
      - ./data/sample-logs:/opt/flume/input:ro
      - ./flume/state:/opt/flume/data
      - /opt/hadoop:/opt/hadoop:ro
    restart: unless-stopped

volumes:
  kafka_data:
