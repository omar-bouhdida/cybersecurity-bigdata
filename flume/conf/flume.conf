agent.sources = auth_source
agent.channels = auth_channel
agent.sinks = auth_sink

# Source: Monitor authentication logs
agent.sources.auth_source.type = TAILDIR
agent.sources.auth_source.positionFile = /opt/flume/data/taildir_position.json
agent.sources.auth_source.filegroups = auth_logs
agent.sources.auth_source.filegroups.auth_logs = /opt/flume/input/auth.log
agent.sources.auth_source.skipToEnd = false

# Channel: Disk-based buffering
agent.channels.auth_channel.type = file
agent.channels.auth_channel.checkpointDir = /opt/flume/data/checkpoint
agent.channels.auth_channel.dataDirs = /opt/flume/data/data
agent.channels.auth_channel.capacity = 10000
agent.channels.auth_channel.transactionCapacity = 1000

# Sink: write events to HDFS
agent.sinks.auth_sink.type = hdfs
agent.sinks.auth_sink.hdfs.path = hdfs://localhost:9000/cybersecurity/raw/flume/%Y-%m-%d
agent.sinks.auth_sink.hdfs.filePrefix = auth
agent.sinks.auth_sink.hdfs.fileType = DataStream
agent.sinks.auth_sink.hdfs.writeFormat = Text
agent.sinks.auth_sink.hdfs.useLocalTimeStamp = true
agent.sinks.auth_sink.hdfs.rollInterval = 30
agent.sinks.auth_sink.hdfs.rollSize = 0
agent.sinks.auth_sink.hdfs.rollCount = 0
agent.sinks.auth_sink.hdfs.idleTimeout = 60

# Connect components
agent.sources.auth_source.channels = auth_channel
agent.sinks.auth_sink.channel = auth_channel
